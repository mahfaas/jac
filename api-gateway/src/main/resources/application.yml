server:
  port: 8083

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/login,/api/auth/refresh,/api/auth/validate
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/users/**
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/orders/**

user-service:
  base-url: ${USER_SERVICE_URL:http://localhost:8080}

auth-service:
  base-url: ${AUTH_SERVICE_URL:http://localhost:8081}

jwt:
  secret: ${JWT_SECRET}
