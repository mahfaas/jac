databaseChangeLog:
  - changeSet:
      id: 003-add-name-surname-trgm-indexes
      author: stas
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS pg_trgm
        - sql:
            sql: CREATE INDEX idx_users_name_trgm ON users USING gin (lower(name) gin_trgm_ops)
        - sql:
            sql: CREATE INDEX idx_users_surname_trgm ON users USING gin (lower(surname) gin_trgm_ops)
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_users_name_trgm
        - sql:
            sql: DROP INDEX IF EXISTS idx_users_surname_trgm
